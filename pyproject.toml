[project]
name = "lca-skills"
version = "0.2.0"
description = "Portable Agent Skills and runtime adapters for expert life cycle assessment"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SDAI Lab" }]
dependencies = []

[project.optional-dependencies]
openlca = ["olca-ipc", "olca-schema"]
brightway = ["bw2data", "bw2calc", "bw2io"]
mcp-sdk = ["mcp"]
dev = ["ruff"]

[project.scripts]
lca-skills = "lca_tools.cli:main"

[tool.setuptools]
packages = ["lca_tools"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
